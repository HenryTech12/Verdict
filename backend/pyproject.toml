[project]
name = "verdict-backend"
version = "1.0.0"
description = "PayPal dispute decisioning agent for small merchants"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2,<3",
  "pydantic-settings>=2,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary] (>=3.2,<4)"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.setuptools]
packages = ["app", "app.adapters", "app.llm", "app.services"]
py-modules = ["seed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
