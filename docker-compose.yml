services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:///./verdict.db
      PAYPAL_MODE: mock
      LLM_PROVIDER: mock
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: [".:/app"]
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_TOKEN: verdict-demo-token
    depends_on: [backend]
