# Render Blueprint: two Docker web services. After the first deploy, set NEXT_PUBLIC_API_URL on
# verdict-web to the public URL of verdict-api and FRONTEND_ORIGIN on verdict-api to the public URL
# of verdict-web, then redeploy both (NEXT_PUBLIC_* values are baked in at build time).
services:
  - type: web
    name: verdict-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - { key: PAYPAL_MODE, value: sandbox }
      - { key: LLM_PROVIDER, value: groq }
      # Set API_TOKEN and NEXT_PUBLIC_API_TOKEN to the SAME long random string (see README: Deploy).
      - { key: API_TOKEN, sync: false }
      - { key: FRONTEND_ORIGIN, sync: false }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: WEBHOOK_SIM_SECRET, sync: false }
      - { key: GROQ_API_KEY, sync: false }
  - type: web
    name: verdict-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - { key: NEXT_PUBLIC_API_URL, sync: false }
      - { key: NEXT_PUBLIC_API_TOKEN, sync: false }
